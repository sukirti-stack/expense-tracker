<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .total {
      text-align: center;
    }

    .total-label {
      font-size: 16px;
      color: #666;
    }

    .total-amount {
      font-size: 36px;
      font-weight: bold;
      margin-top: 8px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      text-align: center;
    }

    .summary-box {
      padding: 10px 5px;
    }

    .summary-label {
      font-size: 13px;
      color: #666;
    }

    .summary-value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .expense-button {
      background: #222;
      color: white;
    }

    .income-button {
      background: #ddd;
      color: #222;
    }

    .account {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .account:last-child {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 15px 0;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>💰 My Expense Tracker</h1>

    <!-- Total Money -->
    <div class="card total">
      <div class="total-label">Total Money</div>
      <div class="total-amount">₹0</div>
    </div>

    <!-- Monthly Summary -->
    <div class="card">

      <h2>This Month</h2>

      <div class="summary">

        <div class="summary-box">
          <div class="summary-label">Income</div>
          <div class="summary-value">₹0</div>
        </div>

        <div class="summary-box">
          <div class="summary-label">Expenses</div>
          <div class="summary-value">₹0</div>
        </div>

        <div class="summary-box">
          <div class="summary-label">Difference</div>
          <div class="summary-value">₹0</div>
        </div>

      </div>

    </div>

    <!-- Buttons -->
    <!-- Buttons -->
<div class="card">

  <div class="buttons">

    <button class="expense-button" onclick="showExpenseForm()">
      + Add Expense
    </button>

    <button class="income-button">
      + Add Income
    </button>

  </div>

</div>

<!-- Expense Form -->
<div class="card" id="expenseForm" style="display: none;">

  <h2>Add Expense</h2>

  <label>Amount</label>

  <input
    type="number"
    id="expenseAmount"
    placeholder="Enter amount"
    style="width: 100%; padding: 12px; margin: 8px 0 15px 0; font-size: 16px;"
  >

  <label>Category</label>

  <select
    id="expenseCategory"
    style="width: 100%; padding: 12px; margin: 8px 0 15px 0; font-size: 16px;"
  >
    <option>Metro</option>
    <option>Food</option>
    <option>Shopping</option>
    <option>Bills</option>
    <option>Travel</option>
    <option>Other</option>
  </select>

  <label>Source</label>

  <select
    id="expenseSource"
    style="width: 100%; padding: 12px; margin: 8px 0 15px 0; font-size: 16px;"
  >
    <option>HDFC Bank</option>
    <option>SBI Bank</option>
    <option>Cash</option>
  </select>

  <button
    class="expense-button"
    onclick="saveExpense()"
    style="width: 100%;"
  >
    Save Expense
  </button>

</div>

    <!-- Accounts -->
    <div class="card">

      <h2>My Money</h2>

      <div class="account">
        <span>HDFC Bank</span>
        <strong>₹0</strong>
      </div>

      <div class="account">
        <span>SBI Bank</span>
        <strong>₹0</strong>
      </div>

      <div class="account">
        <span>Cash</span>
        <strong>₹0</strong>
      </div>

    </div>

    <!-- Transactions -->
    <div class="card">

      <h2>Recent Transactions</h2>

      <div class="empty">
        No transactions yet.
      </div>

    </div>

  </div>
<script>

function showExpenseForm() {

  document.getElementById("expenseForm").style.display = "block";

}

function saveExpense() {

  const amount = document.getElementById("expenseAmount").value;

  const category = document.getElementById("expenseCategory").value;

  const source = document.getElementById("expenseSource").value;

  if (amount === "" || amount <= 0) {

    alert("Please enter an amount.");

    return;

  }

  alert(
    "Expense saved!\n\n" +
    "Amount: ₹" + amount + "\n" +
    "Category: " + category + "\n" +
    "Source: " + source
  );

}

</script>
</body>
</html>
