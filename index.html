<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Expense Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .total {
      text-align: center;
    }

    .total-label {
      color: #666;
    }

    .total-amount {
      font-size: 36px;
      font-weight: bold;
      margin-top: 8px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      text-align: center;
    }

    .summary-label {
      font-size: 13px;
      color: #666;
    }

    .summary-value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .expense-button {
      background: #222;
      color: white;
    }

    .income-button {
      background: #ddd;
      color: #222;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    label {
      font-weight: bold;
    }

    .account {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .account:last-child {
      border-bottom: none;
    }

    .transaction {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .transaction-top {
      display: flex;
      justify-content: space-between;
    }

    .expense-amount {
      font-weight: bold;
    }

    .transaction-details {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 15px 0;
    }

  </style>

</head>


<body>

  <div class="app">

    <h1>💰 My Expense Tracker</h1>


    <!-- TOTAL MONEY -->

    <div class="card total">

      <div class="total-label">
        Total Money
      </div>

      <div
        class="total-amount"
        id="totalMoney"
      >
        ₹0
      </div>

    </div>


    <!-- MONTHLY SUMMARY -->

    <div class="card">

      <h2>This Month</h2>

      <div class="summary">

        <div>

          <div class="summary-label">
            Income
          </div>

          <div
            class="summary-value"
            id="monthlyIncome"
          >
            ₹0
          </div>

        </div>


        <div>

          <div class="summary-label">
            Expenses
          </div>

          <div
            class="summary-value"
            id="monthlyExpenses"
          >
            ₹0
          </div>

        </div>


        <div>

          <div class="summary-label">
            Difference
          </div>

          <div
            class="summary-value"
            id="monthlyDifference"
          >
            ₹0
          </div>

        </div>

      </div>

    </div>


    <!-- BUTTONS -->

    <div class="card">

      <div class="buttons">

       <button
  class="expense-button"
  id="addExpenseButton"
>
  + Add Expense
</button>

<button
  class="income-button"
  id="addIncomeButton"
>
  + Add Income
</button>

      </div>

    </div>


    <!-- EXPENSE FORM -->

    <div
      class="card"
      id="expenseForm"
      style="display:none;"
    >

      <h2>Add Expense</h2>


      <label>
        Amount
      </label>

      <input
        type="number"
        id="expenseAmount"
        placeholder="Enter amount"
      >


      <label>
        Category
      </label>

      <select id="expenseCategory">

        <option>Metro</option>
        <option>Food</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Travel</option>
        <option>Other</option>

      </select>


      <label>
        Source
      </label>

      <select id="expenseSource">

        <option value="hdfc">
          HDFC Bank
        </option>

        <option value="icici">
          ICICI Bank
        </option>

        <option value="cash">
          Cash
        </option>

      </select>


      <button
        class="expense-button"
        onclick="saveExpense()"
        style="width:100%;"
      >
        Save Expense
      </button>

    </div>


    <!-- INCOME FORM -->

    <div
      class="card"
      id="incomeForm"
      style="display:none;"
    >

      <h2>Add Income</h2>


      <label>
        Amount
      </label>

      <input
        type="number"
        id="incomeAmount"
        placeholder="Enter amount"
      >


      <label>
        Source
      </label>

      <select id="incomeSource">

        <option value="hdfc">
          HDFC Bank
        </option>

        <option value="icici">
          ICICI Bank
        </option>

        <option value="cash">
          Cash
        </option>

      </select>


      <button
        class="income-button"
        onclick="saveIncome()"
        style="width:100%;"
      >
        Save Income
      </button>

    </div>


    <!-- ACCOUNTS -->

    <div class="card">

      <h2>My Money</h2>


      <div class="account">

        <span>
          HDFC Bank
        </span>

        <strong id="hdfcBalance">
          ₹0
        </strong>

      </div>


      <div class="account">

        <span>
          ICICI Bank
        </span>

        <strong id="iciciBalance">
          ₹0
        </strong>

      </div>


      <div class="account">

        <span>
          Cash
        </span>

        <strong id="cashBalance">
          ₹0
        </strong>

      </div>

    </div>


    <!-- TRANSACTIONS -->

    <div class="card">

      <h2>Recent Transactions</h2>

      <div id="transactions">

        <div class="empty">
          No transactions yet.
        </div>

      </div>

    </div>

  </div>


<script>

  // =========================
  // BUTTONS
  // =========================

  document.getElementById("addExpenseButton").onclick = function () {

    document.getElementById("expenseForm").style.display = "block";
    document.getElementById("incomeForm").style.display = "none";

  };


  document.getElementById("addIncomeButton").onclick = function () {

    document.getElementById("incomeForm").style.display = "block";
    document.getElementById("expenseForm").style.display = "none";

  };


  // =========================
  // SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://yfihfqvtyxqwfwspckuy.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_QFxard4d0ftZN2W_TVHqmA_txgLDKRx";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // ACCOUNTS
  // =========================

  let accounts = {
    hdfc: 0,
    icici: 0,
    cash: 0
  };


  // =========================
  // TRANSACTIONS
  // =========================

  let transactions = [];
// =========================
// LOAD TRANSACTIONS
// =========================

async function loadTransactions() {

  const { data, error } = await supabaseClient
    .from("transactions")
    .select("*")
    .order("id", { ascending: false });


  if (error) {

    console.error("Could not load transactions:", error);

    alert(
      "Could not load transactions: " +
      error.message
    );

    return;

  }


  // Convert database records into app transactions

  transactions = data.map(function(transaction) {

    return {

      type: transaction.type,

      amount: Number(transaction.amount),

      category: transaction.category,

      source: transaction.source,

      date: transaction.created_at

    };

  });


  // Recalculate account balances

  accounts = {
    hdfc: 0,
    icici: 0,
    cash: 0
  };


  transactions.forEach(function(transaction) {

    if (transaction.type === "income") {

      accounts[transaction.source] += transaction.amount;

    }

    if (transaction.type === "expense") {

      accounts[transaction.source] -= transaction.amount;

    }

  });


  updateScreen();

}

  // =========================
  // SAVE EXPENSE
  // =========================

  async function saveExpense() {

    const amount = Number(
      document.getElementById("expenseAmount").value
    );

    const category =
      document.getElementById("expenseCategory").value;

    const source =
      document.getElementById("expenseSource").value;


    if (amount <= 0) {

      alert("Please enter an amount.");

      return;

    }


    if (amount > accounts[source]) {

      alert("You don't have enough money in this source.");

      return;

    }


    const { error } =
      await supabaseClient
        .from("transactions")
        .insert({
          type: "expense",
          amount: amount,
          category: category,
          source: source
        });


    if (error) {

      console.error(error);

      alert(
        "Could not save expense: " +
        error.message
      );

      return;

    }


   document.getElementById("expenseAmount").value = "";

await loadTransactions();

alert("Expense saved!");


  // =========================
  // SAVE INCOME
  // =========================

  async function saveIncome() {

    const amount = Number(
      document.getElementById("incomeAmount").value
    );

    const source =
      document.getElementById("incomeSource").value;


    if (amount <= 0) {

      alert("Please enter an amount.");

      return;

    }


    const { error } =
      await supabaseClient
        .from("transactions")
        .insert({
          type: "income",
          amount: amount,
          source: source
        });


    if (error) {

      console.error(error);

      alert(
        "Could not save income: " +
        error.message
      );

      return;

    }


    document.getElementById("incomeAmount").value = "";

await loadTransactions();

alert("Income saved!");


  // =========================
  // UPDATE SCREEN
  // =========================

  function updateScreen() {

    document.getElementById("hdfcBalance").textContent =
      "₹" + accounts.hdfc.toLocaleString("en-IN");

    document.getElementById("iciciBalance").textContent =
      "₹" + accounts.icici.toLocaleString("en-IN");

    document.getElementById("cashBalance").textContent =
      "₹" + accounts.cash.toLocaleString("en-IN");


    const total =
      accounts.hdfc +
      accounts.icici +
      accounts.cash;


    document.getElementById("totalMoney").textContent =
      "₹" + total.toLocaleString("en-IN");


    let income = 0;
    let expenses = 0;


    transactions.forEach(function (transaction) {

      if (transaction.type === "income") {

        income += transaction.amount;

      }

      if (transaction.type === "expense") {

        expenses += transaction.amount;

      }

    });


    document.getElementById("monthlyIncome").textContent =
      "₹" + income.toLocaleString("en-IN");

    document.getElementById("monthlyExpenses").textContent =
      "₹" + expenses.toLocaleString("en-IN");

    document.getElementById("monthlyDifference").textContent =
      "₹" + (income - expenses).toLocaleString("en-IN");


    const transactionBox =
      document.getElementById("transactions");


    if (transactions.length === 0) {

      transactionBox.innerHTML =
        '<div class="empty">No transactions yet.</div>';

      return;

    }


    transactionBox.innerHTML = "";


    transactions.forEach(function (transaction) {

      const sourceNames = {

        hdfc: "HDFC Bank",
        icici: "ICICI Bank",
        cash: "Cash"

      };


      const div =
        document.createElement("div");


      div.className = "transaction";


      if (transaction.type === "expense") {

        div.innerHTML = `

          <div class="transaction-top">

            <strong>
              ${transaction.category}
            </strong>

            <span class="expense-amount">
              -₹${transaction.amount.toLocaleString("en-IN")}
            </span>

          </div>

          <div class="transaction-details">

            ${sourceNames[transaction.source]}

          </div>

        `;

      } else {

        div.innerHTML = `

          <div class="transaction-top">

            <strong>
              Income
            </strong>

            <span class="expense-amount">
              +₹${transaction.amount.toLocaleString("en-IN")}
            </span>

          </div>

          <div class="transaction-details">

            ${sourceNames[transaction.source]}

          </div>

        `;

      }


      transactionBox.appendChild(div);

    });

  }


  // =========================
  // START APP
  // =========================

  loadTransactions();

</script>


</body>

</html>
